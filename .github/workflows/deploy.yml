name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets are not configured; building the browser-only demo."
          elif [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set both VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY, or remove both to deploy demo mode."
            exit 1
          fi
          npm run build
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: site
      - name: Publish built site to gh-pages
        run: |
          git -C gh-pages rm -r --ignore-unmatch .
          cp -R site/. gh-pages/
          git -C gh-pages add -A
          if git -C gh-pages diff --cached --quiet; then
            echo "The published site is already up to date."
            exit 0
          fi
          git -C gh-pages -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy site from ${GITHUB_SHA}"
          git -C gh-pages push origin HEAD:gh-pages
